services:
  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discord-music-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=8080
      - DB_PATH=/app/data/voice_tracker.db
    # Port publik dinonaktifkan (tidak ada web dashboard yang diekspos ke IP VPS)
    volumes:
      # Penyimpanan data persisten untuk SQLite database & playlist
      - ./data:/app/data
      # File log persisten agar mudah dipantau langsung di VPS
      - ./logs:/app/logs
      # File cookies YouTube yang valid dari host
      - ./cookies.txt:/app/cookies.txt
      # Mount file kode langsung dari host agar pembaruan instan
      - ./bot_music.py:/app/bot_music.py
      - ./music_player.py:/app/music_player.py
      - ./database.py:/app/database.py
      - ./web_dashboard.py:/app/web_dashboard.py
      - ./ai_playlist.py:/app/ai_playlist.py
      - ./lyrics_manager.py:/app/lyrics_manager.py
      - ./sleep_timer.py:/app/sleep_timer.py
      - ./pomodoro.py:/app/pomodoro.py
      - ./podcast_manager.py:/app/podcast_manager.py
      - ./message_logger.py:/app/message_logger.py
      - ./mirror_manager.py:/app/mirror_manager.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
